[package]
name = "spry"
version = "0.1.0"
edition = "2021"
description = "Repo-local Sprite VM recipes"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Design-pinned YAML crate (0.9 is archived; do not silent-swap).
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
